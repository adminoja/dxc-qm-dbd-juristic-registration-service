#==================
# DXC SAM DB Datasource
#==================
app.datasource.dxc-sam-db:
  jdbc:
    url: jdbc:sqlserver://10.14.33.22;databaseName=SAM
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: dxc_user
    password: patiwat
  hikari:
    minimum-idle: 2 #minimum number of idle connections maintained by HikariCP in a connection pool
    maximum-pool-size: 3 #maximum pool size
  jpa:
    show-sql: true # Attention Required!!
