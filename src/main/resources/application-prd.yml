# ===============================
#  Application Cofig
# ===============================
# Api Connector
infra.connector.dbd-egov-api:
   base_url: "https://api.egov.go.th/ws/dbd/juristic/v7"

#==================
# DXC Primary Data Source
#==================
app.datasource.primary:
  jdbc:
    url: jdbc:h2:mem:primary;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  hikari:
    minimum-idle: 2 #minimum number of idle connections maintained by HikariCP in a connection pool
    maximum-pool-size: 10 #maximum pool size
  jpa:
    show-sql: true # Attention Required!!
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: true  # have the same EntityManager until the web request is finished
    properties:
      # Naming Convention Properties      
      hibernate.physical_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
      # DDL Auto Properties (database) 
      javax.persistence.schema-generation.database.action: drop-and-create # Attention Required!!
      # Extra config
      javax.persistence.schema-generation.scripts.action: drop-and-create # Attention Required!!
      javax.persistence.schema-generation.scripts.create-target: sqls/create-schema.sql # Attention Required!!
      javax.persistence.schema-generation.scripts.drop-target: sqls/drop-schema.sql # Attention Required!!

